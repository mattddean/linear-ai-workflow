services:
  linear_ai_workflow_postgres:
    # PostgreSQL 17.9
    image: postgres:17-alpine@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
    environment:
      POSTGRES_DB: shopping_list
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '3062:5432'
    volumes:
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      - linear_ai_workflow_postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  linear_ai_workflow_postgres_data:
