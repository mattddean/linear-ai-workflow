# Runs the dedicated local Postgres database with a health check and persistent storage.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linear
      POSTGRES_PASSWORD: linear
      POSTGRES_DB: linear_ai_workflow
    ports:
      - '127.0.0.1:5463:5432'
    volumes:
      - workflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linear -d linear_ai_workflow']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  workflow-data:
